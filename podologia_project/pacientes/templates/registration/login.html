{% extends "pacientes/base.html" %}

{% block content %}
<div class="row justify-content-center" style="min-height: 60vh; align-items: center;">
    <div class="col-md-6 col-lg-4">
        <div class="card card-pro shadow-lg border-0">
            <div class="card-header text-center pt-4 pb-0" style="background: transparent; border: none;">
                <h3 class="fw-bold mb-0" style="color: #e91e63;">Iniciar Sesión</h3>
                <p class="text-secondary small">Sistema de Podología</p>
            </div>
            <div class="card-body p-5">
                <form method="post">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger text-center rounded-pill py-2 mb-4 small">
                            Usuario o contraseña incorrectos
                        </div>
                    {% endif %}

                    <div class="mb-4">
                        <label class="form-label text-white ms-3">Usuario</label>
                        <input type="text" name="username" class="form-control input-dark-oval" required autofocus>
                    </div>

                    <div class="mb-5">
                        <label class="form-label text-white ms-3">Contraseña</label>
                        <input type="password" name="password" class="form-control input-dark-oval" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-oval-pro py-2 shadow-lg" style="background: #e91e63;">
                            INGRESAR
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center pb-4 border-0 bg-transparent">
                <small class="text-secondary">© Paola Baeza Podología</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
