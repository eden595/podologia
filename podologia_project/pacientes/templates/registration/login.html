{% extends "pacientes/base.html" %}

{% block auth_content %}
<div class="auth-card">
    <h1 class="auth-title">Ingreso Clinica</h1>
    <p class="auth-subtitle">Accede para gestionar pacientes y atenciones podologicas.</p>

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
            <div class="alert" style="margin-bottom: 14px;">Usuario o contrasena incorrectos.</div>
        {% endif %}

        <div class="field" style="margin-bottom: 12px;">
            <label for="id_username">Usuario o correo</label>
            <input id="id_username" type="text" name="username" class="input" required autofocus autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>

        <div class="field" style="margin-bottom: 18px;">
            <label for="id_password">Contrasena</label>
            <input id="id_password" type="password" name="password" class="input" required autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>

        <button type="submit" class="btn btn-primary btn-wide">
            <span class="material-symbols-outlined">login</span>
            Ingresar
        </button>
    </form>

    <p class="footer-note">Sistema de gestion podologica</p>
</div>
{% endblock %}
