{% extends "pacientes/base.html" %}

{% block content %}
<style>
    .card-equal { 
        height: 100%; 
        display: flex; 
        flex-direction: column; 
        transition: transform 0.2s ease;
    }
    .card-equal:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(233, 30, 99, 0.2) !important;
    }
    .avatar-circle {
        width: 70px; 
        height: 70px; 
        background: linear-gradient(135deg, #333 0%, #222 100%);
        border-radius: 50%; 
        display:flex; 
        align-items:center; 
        justify-content:center;
        border: 2px solid #e91e63;
        margin: 0 auto 15px auto;
    }
</style>

<div class="row align-items-center mb-5 gy-3">
    <div class="col-lg-5">
        <h2 class="fw-bold text-white mb-0">Gestión de Pacientes</h2>
        <p class="text-secondary small mb-0">Administración clínica</p>
    </div>
    
    <div class="col-lg-4">
        <form method="GET">
            <div class="input-group shadow-sm">
                <span class="input-group-text border-secondary text-white" style="border-radius: 50px 0 0 50px !important; border-right: none !important;">
                    <span class="material-icons-round">search</span>
                </span>
                <input type="text" name="buscar" class="form-control border-secondary border-start-0 text-white" placeholder="Buscar por nombre o RUT..." value="{{ termino_busqueda|default:'' }}" style="border-radius: 0 50px 50px 0 !important;">
            </div>
        </form>
    </div>

    <div class="col-lg-3 text-lg-end">
        <a href="{% url 'crear_paciente' %}" class="btn btn-primary btn-oval-pro w-100 shadow-lg" style="background: linear-gradient(45deg, #e91e63, #c2185b); border: none;">
            <span class="material-icons-round align-middle me-1">add</span> NUEVO PACIENTE
        </a>
    </div>
</div>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
    {% for p in pacientes %}
    <div class="col">
        <div class="card card-pro p-4 card-equal shadow">
            <div class="avatar-circle shadow">
                <span class="material-icons-round" style="color:#fff; font-size: 32px;">person</span>
            </div>
            
            <div class="text-center mb-3">
                <h5 class="fw-bold text-white mb-1 text-truncate">{{ p.nombre }}</h5>
                <span class="badge bg-dark border border-secondary text-secondary rounded-pill px-3">
                    {{ p.rut }}
                </span>
            </div>

            <div class="mt-auto">
                <a href="{% url 'detalle_paciente' p.pk %}" class="btn btn-outline-light btn-oval-pro w-100 btn-sm d-flex align-items-center justify-content-center gap-2">
                    VER FICHA <span class="material-icons-round" style="font-size: 16px;">arrow_forward</span>
                </a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
        <span class="material-icons-round display-1 text-secondary opacity-25">search_off</span>
        <h4 class="text-secondary mt-3">No se encontraron pacientes</h4>
    </div>
    {% endfor %}
</div>
{% endblock %}
