<script>
    window.CloudinaryDirectUploads = window.CloudinaryDirectUploads || (function () {
        const signatureCache = new Map();

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
                return parts.pop().split(';').shift();
            }
            return '';
        }

        async function getSignature(signatureUrl, kind) {
            const cacheKey = `${signatureUrl}:${kind}`;
            if (signatureCache.has(cacheKey)) {
                return signatureCache.get(cacheKey);
            }

            const response = await fetch(signatureUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: new URLSearchParams({ kind }),
            });

            if (!response.ok) {
                let detail = 'No se pudo preparar la subida a Cloudinary.';
                try {
                    const payload = await response.json();
                    detail = payload.detail || detail;
                } catch (error) {
                    detail = detail;
                }
                throw new Error(detail);
            }

            const payload = await response.json();
            signatureCache.set(cacheKey, payload);
            return payload;
        }

        function buildJpegName(originalName) {
            const cleanName = (originalName || 'imagen').replace(/\.[^.]+$/, '');
            return `${cleanName}.jpg`;
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const image = new Image();
                image.onload = function () {
                    URL.revokeObjectURL(url);
                    resolve(image);
                };
                image.onerror = function () {
                    URL.revokeObjectURL(url);
                    reject(new Error('No se pudo leer una de las imagenes seleccionadas.'));
                };
                image.src = url;
            });
        }

        async function compressImage(file, options) {
            const config = Object.assign({ maxDimension: 1600, quality: 0.82 }, options || {});
            if (!file || !file.type || !file.type.startsWith('image/')) {
                return file;
            }

            if (file.type === 'image/gif' || file.type === 'image/svg+xml') {
                return file;
            }

            if (file.size <= 450 * 1024) {
                return file;
            }

            const image = await loadImage(file);
            const maxSide = Math.max(image.width, image.height);
            if (maxSide <= config.maxDimension && file.size <= 1.5 * 1024 * 1024) {
                return file;
            }

            const scale = Math.min(1, config.maxDimension / maxSide);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));

            const context = canvas.getContext('2d', { alpha: false });
            context.drawImage(image, 0, 0, canvas.width, canvas.height);

            const blob = await new Promise((resolve) => {
                canvas.toBlob(resolve, 'image/jpeg', config.quality);
            });

            if (!blob || blob.size >= file.size) {
                return file;
            }

            return new File([blob], buildJpegName(file.name), {
                type: 'image/jpeg',
                lastModified: Date.now(),
            });
        }

        async function uploadSingleFile(file, kind, signatureUrl) {
            const signature = await getSignature(signatureUrl, kind);
            const preparedFile = await compressImage(file);
            const formData = new FormData();
            formData.append('file', preparedFile);
            formData.append('api_key', signature.api_key);
            formData.append('folder', signature.folder);
            formData.append('signature', signature.signature);
            formData.append('timestamp', signature.timestamp);
            formData.append('unique_filename', signature.unique_filename);
            formData.append('use_filename', signature.use_filename);

            const response = await fetch(signature.upload_url, {
                method: 'POST',
                body: formData,
            });
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.error && payload.error.message ? payload.error.message : 'Cloudinary rechazo una imagen.');
            }

            return {
                public_id: payload.public_id,
                resource_type: payload.resource_type || 'image',
                secure_url: payload.secure_url || '',
            };
        }

        async function uploadFiles(files, kind, signatureUrl, options) {
            const config = Object.assign({ concurrency: 2, onProgress: null }, options || {});
            const list = Array.from(files || []);
            if (!list.length) {
                return [];
            }

            const results = new Array(list.length);
            let completed = 0;
            let nextIndex = 0;

            async function worker() {
                while (nextIndex < list.length) {
                    const currentIndex = nextIndex++;
                    results[currentIndex] = await uploadSingleFile(list[currentIndex], kind, signatureUrl);
                    completed += 1;
                    if (typeof config.onProgress === 'function') {
                        config.onProgress(completed, list.length);
                    }
                }
            }

            const workerCount = Math.min(config.concurrency, list.length);
            await Promise.all(Array.from({ length: workerCount }, worker));
            return results;
        }

        return {
            uploadFiles,
        };
    })();
</script>
